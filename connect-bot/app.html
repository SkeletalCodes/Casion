<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect 4 Bot</title>
<meta name="description" content="Play Connect 4, 5 or 6 against an AI bot that plays Connect 4 perfectly.">
<style>
  :root {
    --bg: #0f1424; --panel: #182036; --panel-2: #212b47; --line: #2c3757; --text: #eef1f8; --muted: #95a0bd;
    --board: #1d4ed8; --board-2: #1e3a8a; --hole: #0b1020; --you: #facc15; --bot: #ef4444; --win: #22c55e; --accent: #facc15;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; background: radial-gradient(1000px 600px at 50% -10%, #1c2645, var(--bg) 70%); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .app { max-width: 1120px; margin: 0 auto; padding: 24px 16px 40px; display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: -.01em; }
  header .dots { display: flex; gap: 4px; }
  header .dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--you); }
  header .dots i:nth-child(2n) { background: var(--bot); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
  .label { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .field { margin-bottom: 16px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--hole); border: 1px solid var(--line); }
  .seg button { min-height: 40px; padding: 5px 4px; border-radius: 9px; color: var(--muted); font-weight: 700; font-size: 14px; line-height: 1.15; }
  .seg button small { display: block; font-size: 11px; font-weight: 600; opacity: .75; }
  .seg button.on { background: var(--panel-2); color: var(--text); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06); }
  .seg button:focus-visible, .cols button:focus-visible, .new:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .record { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .record div { padding: 9px 6px; border-radius: 12px; background: var(--hole); border: 1px solid var(--line); text-align: center; }
  .record small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .record b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .record .w b { color: var(--you); } .record .l b { color: var(--bot); }
  .new { width: 100%; height: 48px; border-radius: 12px; background: linear-gradient(180deg, #fde047, #eab308); color: #1a1400; font-weight: 800; font-size: 16px; box-shadow: 0 8px 20px rgba(234, 179, 8, .25); }
  .new:hover { filter: brightness(1.05); }
  .note { margin: 14px 0 0; font-size: 13px; color: var(--muted); }
  .stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px; min-height: 520px; }
  .top { width: 100%; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .say { font-size: 21px; font-weight: 800; }
  .say.win { color: var(--win); } .say.lose { color: var(--bot); } .say.draw { color: var(--muted); }
  .say.wait { color: var(--muted); animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .5; } }
  .meta { font-size: 13px; color: var(--muted); }
  .meta b { color: var(--text); }
  .board-wrap { position: relative; width: min(100%, var(--max, 560px)); }
  .board { display: grid; grid-template-columns: repeat(var(--w), 1fr); gap: clamp(3px, 1vw, 8px); padding: clamp(6px, 1.4vw, 12px); border-radius: 18px;
    background: linear-gradient(180deg, var(--board), var(--board-2)); box-shadow: 0 24px 50px rgba(0, 0, 0, .45), inset 0 2px 0 rgba(255, 255, 255, .15); }
  .cell { position: relative; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #050814, var(--hole)); box-shadow: inset 0 3px 6px rgba(0, 0, 0, .7); }
  .cell b { position: absolute; inset: 5%; border-radius: 50%; opacity: 0; transform: scale(.6); transition: opacity .15s, transform .15s; }
  .cell.you b, .cell.bot b, .cell.ghost b { opacity: 1; transform: none; }
  .cell.you b { background: radial-gradient(circle at 38% 32%, #fff7c2, var(--you) 45%, #b8860b); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .2), 0 2px 6px rgba(0, 0, 0, .4); }
  .cell.bot b { background: radial-gradient(circle at 38% 32%, #ffc9c9, var(--bot) 45%, #991b1b); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .2), 0 2px 6px rgba(0, 0, 0, .4); }
  .cell.ghost:not(.you):not(.bot) b { background: var(--you); opacity: .3; }
  .cell.drop b { animation: drop calc(.16s + var(--fall) * .045s) cubic-bezier(.5, 0, .9, .55); z-index: 2; }
  @keyframes drop { from { transform: translateY(calc(var(--fall) * -112%)); } 80% { transform: translateY(0); } 90% { transform: translateY(-7%); } to { transform: translateY(0); } }
  .cell.last b::after { content: ''; position: absolute; inset: 34%; border-radius: 50%; background: rgba(255, 255, 255, .45); }
  .board.done .cell:not(.won) b { filter: saturate(.5) brightness(.7); }
  .cell.won b { animation: won .9s ease-in-out infinite; }
  @keyframes won { 50% { box-shadow: 0 0 0 4px #fff, 0 0 24px 6px rgba(255, 255, 255, .55); } }
  .cols { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--w), 1fr); padding: 0 clamp(6px, 1.4vw, 12px); }
  .cols button { border-radius: 12px; cursor: default; }
  .mine .cols button:not(:disabled) { cursor: pointer; }
  .mine .cols button:not(:disabled):hover { background: rgba(255, 255, 255, .07); }
  .legend { display: flex; gap: 18px; font-size: 13px; color: var(--muted); font-weight: 700; }
  .legend span { display: flex; align-items: center; gap: 7px; }
  .legend i { width: 14px; height: 14px; border-radius: 50%; background: var(--you); }
  .legend i.bot { background: var(--bot); }
  .pop { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.8); opacity: 0; pointer-events: none; z-index: 5;
    padding: 16px 30px; border-radius: 16px; text-align: center; background: rgba(10, 14, 28, .94); border: 2px solid var(--win);
    box-shadow: 0 20px 60px rgba(0, 0, 0, .6); transition: opacity .18s, transform .25s cubic-bezier(.2, 1.4, .4, 1); }
  .pop.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .pop b { display: block; font-size: 32px; color: var(--win); }
  .pop.bad { border-color: var(--bot); } .pop.bad b { color: var(--bot); }
  .pop.push { border-color: var(--muted); } .pop.push b { color: var(--text); }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    header { order: -2; }
    .stage { order: -1; min-height: 0; padding: 14px 10px; }
    .say { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="app">
  <header><span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span><h1>Connect 4 Bot</h1></header>

  <section class="panel" aria-label="Settings">
    <div class="field"><p class="label">Game</p>
      <div class="seg" id="mode">
        <button type="button" data-v="c4" class="on">Connect 4<small>7×6</small></button>
        <button type="button" data-v="c5">Connect 5<small>9×7</small></button>
        <button type="button" data-v="c6">Connect 6<small>11×8</small></button>
      </div></div>
    <div class="field"><p class="label">First move</p>
      <div class="seg" id="first">
        <button type="button" data-v="you" class="on">You start</button>
        <button type="button" data-v="bot">Bot starts</button>
      </div></div>
    <div class="record">
      <div class="w"><small>You won</small><b id="rw">0</b></div>
      <div><small>Draws</small><b id="rd">0</b></div>
      <div class="l"><small>Bot won</small><b id="rl">0</b></div>
    </div>
    <button type="button" class="new" id="new">New game</button>
    <p class="note" id="note"></p>
  </section>

  <section class="panel stage" aria-label="Board">
    <div class="top"><span class="say" id="say" aria-live="polite"></span><span class="meta"><b id="k">4</b> in a row · move <b id="mv">0</b></span></div>
    <div class="board-wrap" id="wrap">
      <div class="board" id="board"></div>
      <div class="cols" id="cols"></div>
    </div>
    <div class="legend"><span><i></i>You</span><span><i class="bot"></i>Bot</span></div>
    <div class="pop" id="pop"></div>
  </section>
</div>

<!-- The bot. These run in a Web Worker (built from this text), so the page never freezes while it thinks. -->
<script type="text/plain" id="book-src">/*BOOK*/</script>
<script type="text/plain" id="ai-src">/*AI*/</script>
<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s), $$ = (s) => Array.from(document.querySelectorAll(s));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const MODES = {
    c4: { w: 7, h: 6, k: 4, ms: 0, max: 560 },
    c5: { w: 9, h: 7, k: 5, ms: 1800, max: 640 },
    c6: { w: 11, h: 8, k: 6, ms: 2200, max: 760 },
  };
  const STORE = 'connect4-bot-record';

  let mode = 'c4', botFirst = false, M = MODES.c4;
  let moves = [], hgt = [], cells = [], over = null, thinking = false, game = 0;
  let record = {};
  try { record = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { record = {}; }
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(record)); } catch (e) { /* private mode */ } };
  const rec = () => record[mode] || (record[mode] = { w: 0, d: 0, l: 0 });

  /* ---------- the bot: a Web Worker built from the code above; in-page if workers can't start ---------- */
  const SRC = $('#book-src').textContent + '\n' + $('#ai-src').textContent;
  let worker = null, reqId = 0, local = null;
  const waiting = {};
  function startWorker() {
    try {
      worker = new Worker(URL.createObjectURL(new Blob([SRC], { type: 'text/javascript' })));
      worker.onmessage = (e) => { const d = e.data || {}, f = waiting[d.id]; if (f) { delete waiting[d.id]; f(d.result); } };
      worker.onerror = () => { worker = null; Object.keys(waiting).forEach((id) => { const f = waiting[id]; delete waiting[id]; f(undefined); }); };
    } catch (e) { worker = null; }
  }
  function inPage(variant, list, opts) {
    if (!local) { (0, eval)(SRC); local = self.ConnectAI; }
    return local.think(variant, list, opts);
  }
  async function ask(variant, list, opts) {
    if (!worker) startWorker();
    if (worker) {
      const id = ++reqId;
      const res = await new Promise((r) => { waiting[id] = r; worker.postMessage({ id, variant, moves: list, opts }); });
      if (res !== undefined) return res;   // undefined: the worker failed, think here instead
    }
    await sleep(30);   // let the "thinking" text paint first
    return inPage(variant, list, opts);
  }
  /** A new game while the bot is thinking: throw that search away. */
  function cancel() {
    if (!thinking || !worker) return;
    worker.terminate();
    worker = null;
    Object.keys(waiting).forEach((id) => { const f = waiting[id]; delete waiting[id]; f(null); });
  }

  /* ---------- rules ---------- */
  const me = () => (botFirst ? 1 : 0);   // your player number (0 moves first)
  const turn = () => moves.length & 1;
  const at = (c, r) => cells[c * M.h + r];
  function line(c, r, p) {
    for (const [dc, dr] of [[1, 0], [0, 1], [1, 1], [1, -1]]) {
      const run = [[c, r]];
      for (const s of [1, -1]) {
        let x = c + dc * s, y = r + dr * s;
        while (x >= 0 && x < M.w && y >= 0 && y < M.h && at(x, y) === p + 1) { run.push([x, y]); x += dc * s; y += dr * s; }
      }
      if (run.length >= M.k) return run;
    }
    return null;
  }

  /* ---------- drawing ---------- */
  const cellEl = (c, r) => $(`.cell[data-c="${c}"][data-r="${r}"]`);
  function paintBoard() {
    let s = '';
    for (let r = M.h - 1; r >= 0; r--) for (let c = 0; c < M.w; c++) s += `<i class="cell" data-c="${c}" data-r="${r}"><b></b></i>`;
    const b = $('#board');
    b.className = 'board';
    b.style.setProperty('--w', M.w);
    b.innerHTML = s;
    $('#cols').style.setProperty('--w', M.w);
    $('#cols').innerHTML = Array.from({ length: M.w }, (_, c) => `<button type="button" data-c="${c}" aria-label="Drop a disc in column ${c + 1}"></button>`).join('');
    $('#wrap').style.setProperty('--max', M.max + 'px');
  }
  function status() {
    $$('.cell.ghost').forEach((x) => x.classList.remove('ghost'));
    const say = $('#say');
    if (over) {
      say.textContent = over.winner === null ? 'Draw — the board is full' : over.winner === me() ? 'You win!' : 'The bot wins';
      say.className = 'say ' + (over.winner === null ? 'draw' : over.winner === me() ? 'win' : 'lose');
    } else if (thinking) { say.textContent = 'Bot is thinking…'; say.className = 'say wait'; }
    else { say.textContent = turn() === me() ? (moves.length ? 'Your move' : 'Your move — drop a disc') : 'Bot to move'; say.className = 'say'; }
    const mine = !over && !thinking && turn() === me();
    $('#wrap').classList.toggle('mine', mine);
    $$('#cols button').forEach((b) => { b.disabled = !mine || hgt[+b.dataset.c] >= M.h; });
    const r = rec();
    $('#rw').textContent = r.w; $('#rd').textContent = r.d; $('#rl').textContent = r.l;
    $('#mv').textContent = moves.length;
  }

  /* ---------- play ---------- */
  function drop(c) {
    const r = hgt[c]++, p = turn();
    cells[c * M.h + r] = p + 1;
    moves.push(c);
    const el = cellEl(c, r);
    el.classList.add(p === me() ? 'you' : 'bot');
    el.style.setProperty('--fall', M.h - r);
    el.classList.add('drop');
    $$('.cell.last').forEach((x) => x.classList.remove('last'));
    el.classList.add('last');
    const run = line(c, r, p);
    if (run) { finish(p, run); return true; }
    if (moves.length === M.w * M.h) { finish(null); return true; }
    return false;
  }
  function finish(winner, run) {
    over = { winner };
    const r = rec();
    if (winner === null) r.d++; else if (winner === me()) r.w++; else r.l++;
    save();
    if (run) run.forEach(([c, rr]) => cellEl(c, rr).classList.add('won'));
    $('#board').classList.add('done');
    const pop = $('#pop');
    pop.className = 'pop show' + (winner === null ? ' push' : winner === me() ? '' : ' bad');
    pop.innerHTML = `<b>${winner === null ? 'Draw' : winner === me() ? 'You win!' : 'Bot wins'}</b>`;
    const g = game;
    setTimeout(() => { if (g === game) pop.classList.remove('show'); }, 2200);   // then show the winning line
    status();
  }
  async function botMove() {
    if (over || turn() === me()) return;
    const g = game, t0 = Date.now();
    thinking = true;
    status();
    const res = await ask(mode, moves.slice(), { ms: M.ms });
    if (g !== game) return;
    const wait = 400 - (Date.now() - t0);   // an instant answer still reads as a move
    if (wait > 0) await sleep(wait);
    if (g !== game) return;
    thinking = false;
    let c = res && res.move;
    if (!(c >= 0 && c < M.w) || hgt[c] >= M.h) {
      const order = Array.from({ length: M.w }, (_, i) => i).sort((a, b) => Math.abs(a - (M.w - 1) / 2) - Math.abs(b - (M.w - 1) / 2));
      c = order.find((x) => hgt[x] < M.h);
    }
    drop(c);
    status();
  }
  function humanMove(c) {
    if (over || thinking || turn() !== me() || !(c >= 0 && c < M.w) || hgt[c] >= M.h) return;
    if (!drop(c)) botMove(); else status();
  }
  function newGame() {
    cancel();
    game++;
    M = MODES[mode];
    moves = []; over = null; thinking = false;
    hgt = new Array(M.w).fill(0);
    cells = new Array(M.w * M.h).fill(0);
    $('#pop').className = 'pop';
    $('#k').textContent = M.k;
    $('#note').textContent = mode === 'c4'
      ? 'On 7×6 the bot plays perfectly. Connect 4 is a win for whoever starts: when the bot starts it always wins, and when you start you can only beat it with a perfect game.'
      : `Get ${M.k} in a row across, up or diagonally. Nobody has solved this board, so the bot searches about 10 moves ahead and never misses a win or a block inside that search.`;
    paintBoard();
    status();
    if (botFirst) botMove();
  }

  /* ---------- controls ---------- */
  function seg(id, cb) {
    $(id).addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      $$(id + ' button').forEach((x) => x.classList.toggle('on', x === b));
      cb(b.dataset.v);
    });
  }
  seg('#mode', (v) => { mode = v; newGame(); });
  seg('#first', (v) => { botFirst = v === 'bot'; newGame(); });
  $('#new').addEventListener('click', newGame);
  $('#cols').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) humanMove(+b.dataset.c); });
  $('#cols').addEventListener('mouseover', (e) => {
    const b = e.target.closest('button');
    $$('.cell.ghost').forEach((x) => x.classList.remove('ghost'));
    if (!b || b.disabled) return;
    const el = cellEl(+b.dataset.c, hgt[+b.dataset.c]);
    if (el) el.classList.add('ghost');
  });
  $('#cols').addEventListener('mouseleave', () => $$('.cell.ghost').forEach((x) => x.classList.remove('ghost')));
  document.addEventListener('keydown', (e) => {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 9 && n <= M.w) humanMove(n - 1);
  });
  newGame();
})();
</script>
</body>
</html>
